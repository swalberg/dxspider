name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: windows-latest
    env:
      APP_NAME: DXSpider-Filters-${{ github.ref_name }}-Windows-x64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install packager
        run: python -m pip install pyinstaller==6.22.2
      - name: Bundle Windows executable
        run: python -m PyInstaller --onefile --windowed --name "$env:APP_NAME" --add-data "samplescripts.txt:." dxspider.py
      - name: Verify bundled GUI and presets
        shell: pwsh
        run: |
          $exe = (Resolve-Path -LiteralPath "dist/$env:APP_NAME.exe").Path
          $app = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(60000)) { throw 'Packaged application timed out.' }
          if ($app.ExitCode -ne 0) { throw "Packaged application exited with code $($app.ExitCode)." }
      - name: Publish executable to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "dist/$env:APP_NAME.exe" --verify-tag --generate-notes
